<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVAGA · Interface</title>
    <style>
        :root {
            --bg-primaire: #0a0a0f;
            --bg-secondaire: #12121a;
            --bg-carte: #1a1a24;
            --accent-rouge: #ff334b;
            --accent-cyan: #00f0ff;
            --texte-main: #e0e0e8;
            --texte-muet: #8c8c9e;
            --bordure: #2a2a3c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-primaire);
            color: var(--texte-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* En-tête */
        header {
            background-color: var(--bg-secondaire);
            border-bottom: 1px solid var(--bordure);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-header {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-rouge);
            box-shadow: 0 0 10px rgba(255, 51, 75, 0.3);
        }

        .header-title h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: var(--texte-main);
        }

        .header-title span {
            font-size: 0.75rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .settings-btn {
            background: none;
            border: 1px solid var(--bordure);
            color: var(--texte-muet);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Conteneur de chat */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--bordure);
        }

        .message.assistant .message-avatar {
            border-color: var(--accent-rouge);
        }

        .message-content {
            background-color: var(--bg-carte);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            border: 1px solid var(--bordure);
            word-break: break-word;
        }

        .message.user .message-content {
            background-color: #1e1e2f;
            border-color: #3a3a5c;
            color: #ffffff;
        }

        /* Zone de saisie */
        .input-panel {
            background-color: var(--bg-secondaire);
            border-top: 1px solid var(--bordure);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background-color: var(--bg-carte);
            border: 1px solid var(--bordure);
            border-radius: 12px;
            padding: 8px 12px;
            gap: 10px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-cyan);
        }

        textarea {
            flex: 1;
            background: none;
            border: none;
            color: var(--texte-main);
            font-size: 0.95rem;
            resize: none;
            max-height: 120px;
            outline: none;
            padding: 4px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--texte-muet);
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: color 0.2s;
        }

        .action-btn:hover {
            color: var(--accent-cyan);
        }

        #send-btn {
            background-color: var(--accent-cyan);
            color: var(--bg-primaire);
            font-weight: bold;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        #send-btn:hover {
            opacity: 0.85;
        }

        /* Modal Paramètres */
        #settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--bg-secondaire);
            border: 1px solid var(--bordure);
            padding: 24px;
            border-radius: 14px;
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-content h3 {
            color: var(--texte-main);
            font-size: 1.1rem;
        }

        .modal-content input {
            background-color: var(--bg-carte);
            border: 1px solid var(--bordure);
            padding: 10px;
            border-radius: 8px;
            color: var(--texte-main);
            width: 100%;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .modal-actions button {
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
        }

        #save-key {
            background-color: var(--accent-cyan);
            color: var(--bg-primaire);
            font-weight: bold;
        }

        #close-modal {
            background: none;
            color: var(--texte-muet);
        }
    </style>
</head>
<body>

    <!-- En-tête -->
    <header>
        <div class="header-left">
            <img src="novaga.jpg" alt="Novaga" class="avatar-header">
            <div class="header-title">
                <h1>NOVAGA</h1>
                <span>Système Actif</span>
            </div>
        </div>
        <button class="settings-btn" id="open-settings" title="Paramètres API">⚙️</button>
    </header>

    <!-- Zone de discussion -->
    <div id="chat-container">
        <div class="message assistant">
            <img src="novaga.jpg" alt="Novaga" class="message-avatar">
            <div class="message-content">Système initialisé. Qu'est-ce qu'on fait aujourd'hui ?</div>
        </div>
    </div>

    <!-- Barre de saisie -->
    <div class="input-panel">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="Envoyer un message à Novaga..." rows="1"></textarea>
            <button id="send-btn">Envoyer</button>
        </div>
    </div>

    <!-- Modale Paramètres (Clé API) -->
    <div id="settings-modal">
        <div class="modal-content">
            <h3>Configuration Clé API Gemini</h3>
            <input type="password" id="api-key-input" placeholder="Colle ta clé API ici...">
            <div class="modal-actions">
                <button id="close-modal">Annuler</button>
                <button id="save-key">Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        // Gestion basique de l'interface des paramètres
        const modal = document.getElementById('settings-modal');
        document.getElementById('open-settings').onclick = () => modal.style.display = 'flex';
        document.getElementById('close-modal').onclick = () => modal.style.display = 'none';
        
        document.getElementById('save-key').onclick = () => {
            const key = document.getElementById('api-key-input').value.trim();
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                modal.style.display = 'none';
                alert('Clé API enregistrée avec succès.');
            }
        };

        // Auto-redimensionnement du textarea
        const textarea = document.getElementById('user-input');
        textarea.oninput = function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        };
    </script>
</body>
</html>
