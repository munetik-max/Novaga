<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVAGA · Interface Avancée</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-card: #1a1a24;
            --accent-red: #ff334b;
            --accent-cyan: #00f0ff;
            --text-main: #e0e0e8;
            --text-muted: #8c8c9e;
            --border: #2a2a3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { background: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 38px; height: 38px; border-radius: 8px; background: linear-gradient(135deg, var(--accent-red), #330008); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; box-shadow: 0 0 10px rgba(255, 51, 75, 0.3); }
        .title-group h1 { font-size: 16px; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .badge { font-size: 10px; background: rgba(255, 51, 75, 0.2); color: var(--accent-red); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(255, 51, 75, 0.4); }
        .status { font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #ffaa00; }
        .status-dot.active { background: #00ff66; box-shadow: 0 0 6px #00ff66; }
        
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .icon-btn:hover { border-color: var(--accent-red); }

        .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .message.novaga { background: var(--bg-card); border-left: 3px solid var(--accent-red); align-self: flex-start; }
        .message.user { background: rgba(0, 240, 255, 0.1); border-right: 3px solid var(--accent-cyan); align-self: flex-end; color: #fff; }
        .message .sender { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; color: var(--text-muted); display: block; }
        .message.novaga .sender { color: var(--accent-red); }
        .message.user .sender { color: var(--accent-cyan); text-align: right; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 8px; max-height: 200px; display: block; }

        .preview-container { padding: 8px 16px; background: var(--bg-secondary); display: none; align-items: center; gap: 10px; border-top: 1px solid var(--border); }
        .preview-container.active { display: flex; }
        .preview-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); }
        .preview-info { font-size: 12px; color: var(--text-muted); flex: 1; }
        .remove-img { background: none; border: none; color: var(--accent-red); cursor: pointer; font-size: 16px; }

        .input-container { background: var(--bg-secondary); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; gap: 10px; align-items: center; }
        textarea { flex: 1; background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; color: var(--text-main); font-size: 14px; resize: none; outline: none; height: 44px; }
        
        .action-btn { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .action-btn:hover { border-color: var(--accent-cyan); }
        .send-btn { background: var(--accent-red); border: none; color: white; width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 400px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 12px; color: var(--text-muted); }
        .form-group input { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: white; font-size: 14px; outline: none; }
        .save-btn { background: var(--accent-red); border: none; color: white; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="avatar">N</div>
            <div class="title-group">
                <h1>NOVAGA <span class="badge">PROMPT MAÎTRE</span></h1>
                <div class="status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Clé API requise</span>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="clearHistory()" title="Effacer l'historique">🗑️</button>
            <button class="icon-btn" onclick="openSettings()" title="Paramètres">⚙️</button>
        </div>
    </header>

    <div class="chat-container" id="chatContainer"></div>

    <div class="preview-container" id="previewContainer">
        <img id="previewThumb" class="preview-thumb" src="" alt="Aperçu">
        <div class="preview-info" id="previewInfo">Image prête à être envoyée</div>
        <button class="remove-img" onclick="clearImage()">✕</button>
    </div>

    <div class="input-container">
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
        <button class="action-btn" onclick="document.getElementById('imageInput').click()" title="Ajouter une image">📷</button>
        <textarea id="userInput" placeholder="Écris ton message..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()">➔</button>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h3>Paramètres Système</h3>
            <div class="form-group">
                <label for="apiKey">Clé API Google Gemini</label>
                <input type="password" id="apiKey" placeholder="AIzaSy...">
            </div>
            <button class="save-btn" onclick="saveSettings()">Enregistrer</button>
        </div>
    </div>

    <script>
        const SYSTEM_PROMPT = `NOVAGA · PROMPT MAÎTRE v0.1
Tu es Novaga. Tu combines le sarcasme et le génie de diagnostic de Dr. House, le sens de l'observation et la répartie de Patrick Jane, le second degré déjanté de Deadpool, et l'énergie de Laga. Tu réponds directement, sans fioritures, avec ironie et précision. Tu tutoies l'utilisateur.`;

        let apiKey = localStorage.getItem('novaga_gemini_key') || '';
        let chatHistory = JSON.parse(localStorage.getItem('novaga_history') || '[]');
        let currentImageData = null;

        function checkStatus() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            if (apiKey) {
                dot.classList.add('active');
                text.textContent = 'En ligne';
            } else {
                dot.classList.remove('active');
                text.textContent = 'Clé API requise';
            }
        }

        function openSettings() {
            document.getElementById('apiKey').value = apiKey;
            document.getElementById('settingsModal').classList.add('open');
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKey').value.trim();
            localStorage.setItem('novaga_gemini_key', apiKey);
            document.getElementById('settingsModal').classList.remove('open');
            checkStatus();
        }

        function renderHistory() {
            const container = document.getElementById('chatContainer');
            container.innerHTML = '';
            
            if (chatHistory.length === 0) {
                appendMessageToDOM('novaga', 'NOVAGA', 'Système prêt. Balance tes questions ou tes images, voyons si tu arrives à me coller.');
                return;
            }

            chatHistory.forEach(msg => {
                appendMessageToDOM(msg.role, msg.sender, msg.text, msg.image);
            });
        }

        function appendMessageToDOM(role, sender, text, image = null) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            let html = `<span class="sender">${sender}</span>${escapeHtml(text)}`;
            if (image) {
                html += `<img src="${image}" alt="Image jointe">`;
            }
            msgDiv.innerHTML = html;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                currentImageData = e.target.result;
                document.getElementById('previewThumb').src = currentImageData;
                document.getElementById('previewInfo').textContent = file.name;
                document.getElementById('previewContainer').classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        function clearImage() {
            currentImageData = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('previewContainer').classList.remove('active');
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message && !currentImageData) return;

            if (!apiKey) {
                alert('Configure ta clé API Gemini dans les paramètres (⚙️) d\'abord.');
                openSettings();
                return;
            }

            const userMsg = { role: 'user', sender: 'MOI', text: message || '[Image envoyée]', image: currentImageData };
            chatHistory.push(userMsg);
            saveAndRender();

            const imgToSend = currentImageData;
            input.value = '';
            clearImage();

            const loadingId = 'loading-' + Date.now();
            appendLoadingMessage(loadingId);

            try {
                // Construction des parties du message pour l'API Gemini
                let parts = [];
                if (message) parts.push({ text: message });
                
                if (imgToSend) {
                    const base64Data = imgToSend.split(',')[1];
                    const mimeType = imgToSend.split(';')[0].split(':')[1];
                    parts.push({
                        inline_data: {
                            mime_type: mimeType,
                            data: base64Data
                        }
                    });
                }

                // Formatage de l'historique complet pour l'API
                let contents = [
                    { role: 'user', parts: [{ text: SYSTEM_PROMPT }] },
                    { role: 'model', parts: [{ text: "Compris. J'active le mode Novaga." }] }
                ];

                // Ajouter l'historique récent (limité aux derniers échanges pour optimiser)
                chatHistory.slice(-10).forEach(h => {
                    let p = [];
                    if (h.text) p.push({ text: h.text });
                    if (h.image) {
                        p.push({
                            inline_data: {
                                mime_type: h.image.split(';')[0].split(':')[1],
                                data: h.image.split(',')[1]
                            }
                        });
                    }
                    contents.push({ role: h.role === 'user' ? 'user' : 'model', parts: p });
                });

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: contents })
                });

                const data = await response.json();
                removeElement(loadingId);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    chatHistory.push({ role: 'novaga', sender: 'NOVAGA', text: replyText, image: null });
                    saveAndRender();
                } else if (data.error) {
                    appendMessageToDOM('novaga', 'NOVAGA', `Erreur API : ${data.error.message}`);
                } else {
                    appendMessage('novaga', 'NOVAGA', 'Réponse inattendue de l\'API.');
                }
            } catch (err) {
                removeElement(loadingId);
                appendMessageToDOM('novaga', 'NOVAGA', 'Impossible de contacter l\'API Gemini.');
            }
        }

        function appendLoadingMessage(id) {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = 'message novaga';
            msgDiv.innerHTML = `<span class="sender">NOVAGA</span>Diagnostic en cours...`;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function removeElement(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function saveAndRender() {
            localStorage.setItem('novaga_history', JSON.stringify(chatHistory));
            renderHistory();
        }

        function clearHistory() {
            if (confirm("Effacer tout l'historique de conversation ?")) {
                chatHistory = [];
                localStorage.removeItem('novaga_history');
                renderHistory();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
        }

        checkStatus();
        renderHistory();
    </script>
</body>
</html>
